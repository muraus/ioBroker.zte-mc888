version: 2
updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      open-pull-requests-limit: 15
      # Wait a few days before picking up brand new releases (supply chain risk).
      cooldown:
          default-days: 7
      ignore:
          # @types/node must stay on the major version matching engines.node,
          # otherwise the type check validates against a newer Node.js API.
          - dependency-name: '@types/node'
            update-types:
                - version-update:semver-major
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      open-pull-requests-limit: 15
